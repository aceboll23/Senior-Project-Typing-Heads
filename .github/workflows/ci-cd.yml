name: CI/CD — Test and Deploy

on:
  push:
    branches: [ main ]

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run unit tests
        run: dotnet test tests/BoredGamers.Tests/BoredGamers.Tests.csproj --no-restore --verbosity normal

  bdd-tests:
    name: Run BDD Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: Passw0rd_Bdd
          ACCEPT_EULA: Y
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build app
        run: dotnet build src/BoredGamers/BoredGamers.csproj --no-restore -c Release

      - name: Wait for SQL Server
        run: |
          echo "Waiting for SQL Server to accept connections..."
          for i in $(seq 1 30); do
            if nc -z localhost 1433; then
              echo "SQL Server port is open — waiting for initialization..."
              sleep 10
              exit 0
            fi
            sleep 3
          done
          echo "SQL Server did not start in time"
          exit 1

      - name: Start app in background
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5144
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=BoredGamersCI;User Id=SA;Password=Passw0rd_Bdd;TrustServerCertificate=True;"
          ConnectionStrings__BddConnection: "Server=localhost,1433;Database=BoredGamersCI;User Id=SA;Password=Passw0rd_Bdd;TrustServerCertificate=True;"
        run: dotnet run --project src/BoredGamers/BoredGamers.csproj --no-build -c Release &

      - name: Wait for app to be ready
        run: |
          echo "Waiting for app to start..."
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5144 || echo "000")
            if echo "$STATUS" | grep -qE "^[2-4]"; then
              echo "App is ready (HTTP $STATUS)"
              exit 0
            fi
            sleep 3
          done
          echo "App did not start in time"
          exit 1

      - name: Run BDD tests
        env:
          BDD_BASE_URL: http://localhost:5144
        run: dotnet test Senior-Project-Typing-Heads.BddTests/Senior-Project-Typing-Heads.BddTests.csproj --no-restore --verbosity normal

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: [unit-tests, bdd-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build and publish
        run: dotnet publish src/BoredGamers/BoredGamers.csproj -c Release -o ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'boredgamers-dev'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
