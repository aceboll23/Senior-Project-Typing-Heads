<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - BoredGamers</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- Lucide Icons (via CDN) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

  <!-- Navbar (minimal) -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-logo">BoredGamers</a>

      <div class="navbar-nav">
        <a href="games.html" class="nav-link">Games</a>
        <a href="groups.html" class="nav-link">Groups</a>
        <a href="about.html" class="nav-link">About</a>
      </div>

      <div class="navbar-actions">
        <div class="logged-out-only flex items-center gap-sm">
          <button class="btn btn-ghost" data-action="login">Log In</button>
          <button class="btn btn-primary" data-modal="register-modal">Sign Up</button>
        </div>

        <button class="navbar-mobile-toggle" id="mobile-nav-toggle" aria-label="Open menu">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Mobile Navigation -->
  <div class="mobile-nav-overlay" id="mobile-nav-overlay">
    <div class="mobile-nav">
      <div class="mobile-nav-header">
        <span class="navbar-logo">BoredGamers</span>
        <button class="mobile-nav-close" id="mobile-nav-close" aria-label="Close menu">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="mobile-nav-body">
        <div class="mobile-nav-links">
          <a href="index.html" class="mobile-nav-link">
            <i data-lucide="home" class="w-5 h-5"></i>
            Home
          </a>
          <a href="games.html" class="mobile-nav-link">
            <i data-lucide="dice-5" class="w-5 h-5"></i>
            Games
          </a>
          <a href="groups.html" class="mobile-nav-link">
            <i data-lucide="users" class="w-5 h-5"></i>
            Groups
          </a>
          <a href="about.html" class="mobile-nav-link">
            <i data-lucide="info" class="w-5 h-5"></i>
            About
          </a>
        </div>
      </div>
      <div class="mobile-nav-footer">
        <div class="logged-out-only flex flex-col gap-sm">
          <button class="btn btn-primary btn-lg" style="width: 100%;" data-action="login">Log In</button>
          <button class="btn btn-secondary btn-lg" style="width: 100%;" data-modal="register-modal">Sign Up</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================================================
       Main Content
       ======================================================================== -->
  <main class="auth-page">
    <div class="auth-card">
      <!-- Request Reset State -->
      <div id="reset-request">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">
          Enter your email and we'll send you a reset link.
        </p>

        <form>
          <div class="form-group">
            <label class="form-label" for="reset-email">Email</label>
            <input type="email" id="reset-email" class="form-input" placeholder="Enter your email">
          </div>
          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
            Send Reset Link
          </button>
        </form>

        <div class="mt-lg text-center">
          <a href="#" data-action="login" class="text-small">Back to Login</a>
        </div>
      </div>

      <!-- Set New Password State (simulated - would need URL token in real app) -->
      <!--
      <div id="reset-newpassword" class="hidden">
        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle">
          Enter your new password below.
        </p>

        <form>
          <div class="form-group">
            <label class="form-label" for="new-password">New Password</label>
            <input type="password" id="new-password" class="form-input" placeholder="Enter new password">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-input" placeholder="Confirm new password">
          </div>
          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
            Reset Password
          </button>
        </form>
      </div>
      -->

      <!-- Success State (shown after form submit) -->
      <!--
      <div id="reset-success" class="hidden">
        <div class="text-center">
          <div style="font-size: 3rem; margin-bottom: var(--space-md);">
            <i data-lucide="check-circle" style="color: var(--accent-secondary);"></i>
          </div>
          <h1 class="auth-title">Check Your Email</h1>
          <p class="auth-subtitle">
            We've sent a password reset link to your email address.
          </p>
          <a href="#" data-action="login" class="btn btn-primary btn-lg mt-lg">
            Back to Login
          </a>
        </div>
      </div>
      -->
    </div>
  </main>

  <!-- Login Modal -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Log In</h2>
        <button class="modal-close" data-modal-close aria-label="Close">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="modal-body">
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email or Username</label>
            <input type="text" id="login-email" class="form-input" placeholder="Enter your email or username">
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-input" placeholder="Enter your password">
          </div>
          <div class="form-group">
            <a href="reset-password.html" class="text-small">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Log In</button>
        </form>
        <div class="mt-md text-center">
          <button class="btn btn-ghost btn-sm" data-action="quick-login">Quick Demo Login</button>
        </div>
      </div>
      <div class="modal-footer" style="justify-content: center; border-top: 1px solid var(--border-color); padding-top: var(--space-md); margin-top: var(--space-md);">
        <p class="text-small text-muted">
          Don't have an account? <a href="#" data-action="show-register">Sign Up</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Register Modal -->
  <div class="modal-overlay" id="register-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Create Account</h2>
        <button class="modal-close" data-modal-close aria-label="Close">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="modal-body">
        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="register-username">Username</label>
            <input type="text" id="register-username" class="form-input" placeholder="Choose a username">
          </div>
          <div class="form-group">
            <label class="form-label" for="register-email">Email</label>
            <input type="email" id="register-email" class="form-input" placeholder="Enter your email">
          </div>
          <div class="form-group">
            <label class="form-label" for="register-password">Password</label>
            <input type="password" id="register-password" class="form-input" placeholder="Create a password">
          </div>
          <div class="form-group">
            <label class="form-label" for="register-confirm">Confirm Password</label>
            <input type="password" id="register-confirm" class="form-input" placeholder="Confirm your password">
          </div>
          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Create Account</button>
        </form>
      </div>
      <div class="modal-footer" style="justify-content: center; border-top: 1px solid var(--border-color); padding-top: var(--space-md); margin-top: var(--space-md);">
        <p class="text-small text-muted">
          Already have an account? <a href="#" data-action="show-login">Log In</a>
        </p>
      </div>
    </div>
  </div>

  <!-- javascript - Scripts -->
  <script src="js/main.js"></script>
  <script>
    // javascript - Initialize Lucide icons
    lucide.createIcons();
  </script>
</body>
</html>
